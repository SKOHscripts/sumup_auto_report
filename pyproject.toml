[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sumup-auto-report"
version = "0.1.0"
description = "Rapports automatiques SumUp : adhésions, gestion des stocks et membres Paheko"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

authors = [
  { name = "Corentin", email = "" },
]

keywords = ["sumup", "report", "paheko", "adhesions", "stocks", "pdf", "cron"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Utilities",
]

dependencies = [
  "requests>=2.31",
  "fpdf2>=2.7,<3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "python-dateutil>=2.8",
  "openpyxl>=3.1",
  "google-api-python-client>=2.100",
  "google-auth>=2.20",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = [
  "streamlit>=1.35",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "mypy>=1.0",
]

[project.scripts]
sumup-adhesions    = "adhesions.sumup_adhesions:main"
sumup-stocks       = "stocks.sumup_stocks:main"
paheko-dashboard   = "paheko_stats.paheko:main"
update-purchases   = "stocks.update_stock_from_purchases:main"

[project.urls]
Homepage   = "https://github.com/SKOHscripts/sumup_auto_report"
Repository = "https://github.com/SKOHscripts/sumup_auto_report"
Issues     = "https://github.com/SKOHscripts/sumup_auto_report/issues"

# ── Hatch build config ──────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["adhesions", "utils", "stocks", "paheko_stats"]

# ── Ruff (linter/formatter) ──────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # ligne trop longue — les scripts ont des f-strings longues

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true  # requests, fpdf2 n'ont pas toujours des stubs complets

# ── Pylint ───────────────────────────────────────────────────────────────────
[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 8
max-locals = 55
max-statements = 160
max-branches = 20
max-module-lines = 2000

[tool.pylint.basic]
good-names = "i,j,k,v,p,n,w,f,e,c,ax,x,y,dt,ts,sm,pw,kpi"

[tool.pylint.similarities]
min-similarity-lines = 8

[tool.pylint.main]
ignore-paths = ["tests"]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "wrong-import-position",
    "wrong-import-order",
    "duplicate-code",
    "too-few-public-methods",
    "broad-exception-caught",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
]

# ── Bandit (sécurité) ────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests"]   # assert B101 et placeholders de test sont intentionnels

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
